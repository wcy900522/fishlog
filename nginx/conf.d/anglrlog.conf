upstream anglrlog_api {
    server api:8000;
    keepalive 32;
}

# HTTP to HTTPS 重定向 (域名访问)
server {
    listen 80;
    listen [::]:80;
    server_name anglrlog.com www.anglrlog.com;

    return 301 https://$host$request_uri;
}

# HTTP to HTTPS 重定向 (IP 访问)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS 主服务器 (域名访问)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anglrlog.com www.anglrlog.com;

    ssl_certificate /etc/ssl/anglrlog/www.anglrlog.com.pem;
    ssl_certificate_key /etc/ssl/anglrlog/www.anglrlog.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://anglrlog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_redirect off;
    }
}

# HTTPS 默认服务器 (IP 或其他访问)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    ssl_certificate /etc/ssl/anglrlog/www.anglrlog.com.pem;
    ssl_certificate_key /etc/ssl/anglrlog/www.anglrlog.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://anglrlog_api;
        proxy_http_version 1.1;
        proxy_set_header Host www.anglrlog.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_redirect off;
    }
}
