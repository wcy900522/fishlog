{% extends "base.html" %}
{% from "_macros.html" import page_head %}

{% block title %}排行榜 - AnglrLog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/pages/leaderboards.css?v={{ asset_v }}">
{% endblock %}

{% block content %}
<div class="container-app container-app--narrow">
    {{ page_head('排行榜', icon='fa-trophy', sub='围绕真实记录、技术分享和钓点贡献的成长排行。', eyebrow='社区') }}

    <div class="tabs-app mb-4 reveal" id="boardTabs" role="tablist"></div>

    <section class="card reveal" id="boardPanel">
        <div class="card-header">
            <div>
                <h2 id="boardTitle">加载中…</h2>
                <p class="board__rule" id="boardRule"></p>
            </div>
            <span class="badge badge-info" id="boardScoreLabel"></span>
        </div>
        <div id="boardBody"></div>
    </section>
</div>

<script>
    const boardConfig = [
        ['today_active', '今日活跃', '今日 XP', '按今日获得的经验值排序，经验相同按总 XP 排序。', 'fa-bolt'],
        ['month_xp', '本月经验', '本月 XP', '按本月累计获得经验值排序，经验相同按总 XP 排序。', 'fa-calendar'],
        ['year_king', '年度钓王', '年度 XP', '按今年累计获得经验值排序，经验相同按总 XP 排序。', 'fa-crown'],
        ['catch_streak', '连续记录', '连续天数', '按最近 30 天连续出钓记录天数排序，天数相同按总 XP 排序。', 'fa-fire'],
        ['tech_authors', '技术作者', '技术帖', '按技术分享帖数量排序，数量相同按总 XP 排序。', 'fa-pen-nib'],
        ['spot_contributors', '钓点贡献', '钓点数', '按贡献钓点数量排序，数量相同按总 XP 排序。', 'fa-map-location-dot']
    ];
    let boardData = null;
    let activeKey = boardConfig[0][0];

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    function renderTabs() {
        document.getElementById('boardTabs').innerHTML = boardConfig.map(([key, title, , , icon]) => `
            <button type="button" class="tabs-app__tab${key === activeKey ? ' active' : ''}" role="tab" aria-selected="${key === activeKey}" data-key="${key}" onclick="selectBoard('${key}')">
                <i class="fas ${icon}"></i> ${title}
            </button>
        `).join('');
    }

    function renderBoard() {
        const [key, title, scoreLabel, rule] = boardConfig.find(c => c[0] === activeKey);
        const rows = (boardData && boardData[key]) ? boardData[key].slice(0, 10) : [];
        document.getElementById('boardTitle').textContent = `${title}榜`;
        document.getElementById('boardRule').textContent = rule;
        document.getElementById('boardScoreLabel').textContent = scoreLabel;

        const body = document.getElementById('boardBody');
        if (!rows.length) {
            body.innerHTML = `<div class="p-4">${AnglrState({ title: '暂无数据', text: '本榜单还没有上榜的钓友。', icon: 'fa-trophy' })}</div>`;
            return;
        }

        const podium = rows.slice(0, 3);
        const rest = rows.slice(3);
        body.innerHTML = `
            <div class="podium">
                ${podium.map((item, index) => `
                    <div class="podium__item podium__item--${index + 1}">
                        <span class="rank-badge rank-badge--${index + 1}">${index + 1}</span>
                        <span class="avatar avatar--lg">${escapeHTML(String(item.nickname || '?').charAt(0).toUpperCase())}</span>
                        <strong class="podium__name">${escapeHTML(item.nickname)}</strong>
                        <span class="podium__level">Lv${item.level} ${escapeHTML(item.title)}</span>
                        <span class="podium__score font-display">${item.score}<small>${escapeHTML(scoreLabel)}</small></span>
                    </div>
                `).join('')}
            </div>
            ${rest.length ? `<ol class="board-list">
                ${rest.map((item, index) => `
                    <li class="board-list__row">
                        <span class="rank-badge">${index + 4}</span>
                        <div class="board-list__user">
                            <strong>${escapeHTML(item.nickname)}</strong>
                            <span>Lv${item.level} ${escapeHTML(item.title)} · ${item.xp} XP</span>
                        </div>
                        <span class="board-list__score">${item.score}</span>
                    </li>
                `).join('')}
            </ol>` : ''}
        `;
    }

    function selectBoard(key) {
        activeKey = key;
        renderTabs();
        renderBoard();
    }

    async function loadLeaderboards() {
        const body = document.getElementById('boardBody');
        body.innerHTML = `<div class="p-4">${AnglrSkeleton('row', 3)}</div>`;
        renderTabs();
        try {
            const response = await fetch('/api/users/leaderboards');
            if (!response.ok) throw new Error('加载排行榜失败');
            boardData = await response.json();
            renderBoard();
        } catch (error) {
            body.innerHTML = `<div class="p-4">${AnglrState({ type: 'error', title: '加载失败', text: error.message })}</div>`;
        }
    }

    document.addEventListener('DOMContentLoaded', loadLeaderboards);
</script>
{% endblock %}
