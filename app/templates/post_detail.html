{% extends "base.html" %}

{% block title %}帖子详情 - AnglrLog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/pages/post_detail.css?v={{ asset_v }}">
{% endblock %}

{% block content %}
<div class="container-app container-app--narrow">
    <ol class="breadcrumb-app" aria-label="面包屑">
        <li><a href="/">首页</a></li>
        <li><a href="/forum">讨论专区</a></li>
        <li id="crumb-post">帖子</li>
    </ol>

    <div id="postContent">
        <div class="post-head">
            <span class="skeleton skeleton--title"></span>
            <span class="skeleton skeleton--text"></span>
        </div>
        <span class="skeleton skeleton--text"></span>
        <span class="skeleton skeleton--text"></span>
        <span class="skeleton skeleton--text"></span>
        <span class="skeleton skeleton--text"></span>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const postId = {{ post_id }};
    const POST_TAGS = ['海钓', '路亚', '台钓', '飞钓', '黑坑', '野钓', '技术分享', '装备评测', '钓点攻略', '秀出鱼获'];
    let currentUserId = null;
    let currentUserIsAdmin = false;
    let postUserId = null;
    let currentPost = null;

    function formatDate(dateString) {
        const date = new Date(dateString);
        if (Number.isNaN(date.getTime())) return '';
        return date.toLocaleString('zh-CN', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, function(char) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char];
        });
    }

    function initialOf(name) {
        return escapeHTML(String(name || '匿').trim().charAt(0).toUpperCase() || '匿');
    }

    function levelChip(level, title) {
        return `<span class="post-level">Lv${Number(level) || 1} · ${escapeHTML(title || '初学钓手')}</span>`;
    }

    function handleError(error, prefix) {
        console.error('Error:', error);
        if (String(error.message).includes('登录状态已失效')) {
            redirectToLogin(error.message);
            return;
        }
        AnglrToast.error(prefix ? `${prefix}：${error.message}` : error.message);
    }

    function requireLogin(message) {
        if (localStorage.getItem('token')) return true;
        redirectToLogin(message || '请先登录');
        return false;
    }

    function renderComment(comment, isLoggedIn) {
        const canManage = isLoggedIn && (currentUserId === comment.user_id || currentUserIsAdmin);
        return `
            <article class="comment" id="comment-${comment.id}">
                <span class="avatar avatar--sm" aria-hidden="true">${initialOf(comment.user_nickname)}</span>
                <div class="comment__main">
                    <div class="comment__head">
                        <strong>${escapeHTML(comment.user_nickname || '未知用户')}</strong>
                        ${levelChip(comment.user_level, comment.user_title)}
                        <time datetime="${escapeHTML(comment.created_at)}">${formatDate(comment.created_at)}</time>
                    </div>
                    <div class="comment__content" id="comment-content-${comment.id}">${escapeHTML(comment.content)}</div>
                    <div class="comment__actions">
                        <button class="btn btn-sm btn-ghost" type="button" onclick="likeComment(event, ${comment.id})" aria-label="点赞评论">
                            <i class="fas fa-heart"></i>${comment.like_count || 0}
                        </button>
                        ${canManage ? `
                            <button class="btn btn-sm btn-ghost" type="button" onclick="editComment(${comment.id})"><i class="fas fa-pen"></i>编辑</button>
                            <button class="btn btn-sm btn-ghost text-danger" type="button" onclick="deleteComment(${comment.id})"><i class="fas fa-trash"></i>删除</button>
                        ` : ''}
                    </div>
                </div>
            </article>
        `;
    }

    async function loadPost() {
        const container = document.getElementById('postContent');
        try {
            const post = await apiFetch(`/api/forum/posts/${postId}`);
            currentPost = post;
            postUserId = post.user_id;
            document.title = `${post.title} - 讨论专区 - AnglrLog`;
            document.getElementById('crumb-post').textContent = post.title;

            const isLoggedIn = Boolean(localStorage.getItem('token') && currentUserId);
            const canManage = isLoggedIn && (currentUserId === postUserId || currentUserIsAdmin);
            const images = Array.isArray(post.image_urls) ? post.image_urls.filter(Boolean) : [];
            const comments = Array.isArray(post.comments) ? post.comments : [];

            container.innerHTML = `
                <article>
                    <header class="post-head">
                        <div class="post-head__tags">
                            <span class="badge badge-info">${escapeHTML(post.tag || '野钓')}</span>
                            ${post.is_featured ? '<span class="badge badge-amber"><i class="fas fa-star"></i>精华</span>' : ''}
                        </div>
                        <h1 class="post-head__title">${escapeHTML(post.title)}</h1>
                        <div class="post-head__meta">
                            <span class="post-head__author">
                                <span class="avatar avatar--sm" aria-hidden="true">${initialOf(post.user_nickname)}</span>
                                <strong>${escapeHTML(post.user_nickname || '未知用户')}</strong>
                                ${levelChip(post.user_level, post.user_title)}
                            </span>
                            <span><i class="fas fa-clock"></i>${formatDate(post.created_at)}</span>
                            <span><i class="fas fa-eye"></i>${post.view_count || 0} 次浏览</span>
                        </div>
                    </header>

                    <div class="post-body">${escapeHTML(post.content)}</div>

                    ${images.length ? `
                        <div class="post-gallery post-gallery--${Math.min(images.length, 3)}">
                            ${images.map(url => `
                                <a href="${escapeHTML(url)}" target="_blank" rel="noopener">
                                    <img src="${escapeHTML(url)}" alt="帖子图片" loading="lazy">
                                </a>
                            `).join('')}
                        </div>
                    ` : ''}

                    <div class="post-actions">
                        <button class="btn btn-secondary" type="button" onclick="likePost(event)">
                            <i class="fas fa-heart"></i>赞 ${post.like_count || 0}
                        </button>
                        <a class="btn btn-ghost" href="#comments"><i class="fas fa-comment"></i>评论 ${comments.length}</a>
                        <span class="post-actions__spacer"></span>
                        ${canManage ? `
                            <button class="btn btn-secondary" type="button" onclick="editPost()"><i class="fas fa-pen"></i>编辑</button>
                            <button class="btn btn-danger" type="button" onclick="deletePost()"><i class="fas fa-trash"></i>删除</button>
                        ` : ''}
                        ${currentUserIsAdmin && !post.is_featured ? `
                            <button class="btn btn-secondary" type="button" onclick="featurePost()"><i class="fas fa-star"></i>设为精华</button>
                        ` : ''}
                    </div>
                </article>

                <section id="comments" aria-labelledby="commentsTitle">
                    <div class="section-bar">
                        <h2 class="section-title" id="commentsTitle"><i class="fas fa-comments" aria-hidden="true"></i>评论<span class="section-count">· ${comments.length} 条</span></h2>
                    </div>

                    ${isLoggedIn ? `
                        <div class="card comment-form">
                            <div class="card-body">
                                <label for="newComment" class="form-label">发表评论</label>
                                <textarea class="form-control" id="newComment" rows="3" maxlength="2000" placeholder="说说你的看法或经验…"></textarea>
                                <div class="comment-form__actions">
                                    <button class="btn btn-primary" type="button" id="submitCommentBtn" onclick="submitComment()"><i class="fas fa-paper-plane"></i>发表评论</button>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <div class="alert alert-info comment-form">
                            <i class="fas fa-right-to-bracket"></i>
                            <span><a href="/login">登录</a> 后即可点赞和评论。</span>
                        </div>
                    `}

                    <div class="comment-list">
                        ${comments.length
                            ? comments.map(comment => renderComment(comment, isLoggedIn)).join('')
                            : AnglrState({ title: '还没有评论', text: isLoggedIn ? '说点什么，成为第一个评论的人。' : '登录后可以第一个发表看法。', icon: 'fa-comment-dots' })}
                    </div>
                </section>
            `;
        } catch (error) {
            console.error('Error:', error);
            container.innerHTML = AnglrState({ type: 'error', title: '帖子加载失败', text: error.message, actionHref: '/forum', actionText: '返回讨论专区' });
        }
    }

    async function submitComment() {
        const input = document.getElementById('newComment');
        const content = input.value.trim();
        if (!content) {
            AnglrToast.warning('评论内容不能为空');
            input.focus();
            return;
        }
        if (!requireLogin('登录后即可评论')) return;

        const button = document.getElementById('submitCommentBtn');
        button.disabled = true;
        try {
            await apiFetch(`/api/forum/posts/${postId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            AnglrToast.success('评论已发表');
            loadPost();
        } catch (error) {
            button.disabled = false;
            handleError(error, '评论失败');
        }
    }

    async function likePost(event) {
        event.stopPropagation();
        if (!requireLogin('登录后即可点赞')) return;
        try {
            await apiFetch(`/api/forum/posts/${postId}/likes`, { method: 'POST' });
            loadPost();
        } catch (error) {
            handleError(error);
        }
    }

    async function likeComment(event, commentId) {
        event.stopPropagation();
        if (!requireLogin('登录后即可点赞')) return;
        try {
            await apiFetch(`/api/forum/comments/${commentId}/likes`, { method: 'POST' });
            loadPost();
        } catch (error) {
            handleError(error);
        }
    }

    async function featurePost() {
        const ok = await AnglrConfirm({ title: '设为精华', body: '将该帖子设为精华并奖励作者 100 XP？', okText: '设为精华' });
        if (!ok) return;
        try {
            await apiFetch(`/api/forum/posts/${postId}/feature`, { method: 'POST' });
            AnglrToast.success('已设为精华');
            loadPost();
        } catch (error) {
            handleError(error, '设置失败');
        }
    }

    async function deleteComment(commentId) {
        const ok = await AnglrConfirm({ title: '删除评论', body: '删除后不可恢复，确认删除这条评论？', okText: '删除', danger: true });
        if (!ok) return;
        try {
            await apiFetch(`/api/forum/comments/${commentId}`, { method: 'DELETE' });
            AnglrToast.success('评论已删除');
            loadPost();
        } catch (error) {
            handleError(error, '删除失败');
        }
    }

    function editComment(commentId) {
        const comment = currentPost?.comments?.find(item => item.id === commentId);
        const contentEl = document.getElementById(`comment-content-${commentId}`);
        if (!comment || !contentEl) return;

        contentEl.innerHTML = `
            <div class="comment__edit">
                <textarea class="form-control" id="editCommentInput-${commentId}" rows="3" maxlength="2000">${escapeHTML(comment.content)}</textarea>
                <div class="comment__edit-actions">
                    <button class="btn btn-sm btn-secondary" type="button" onclick="loadPost()"><i class="fas fa-xmark"></i>取消</button>
                    <button class="btn btn-sm btn-primary" type="button" onclick="saveCommentEdit(${commentId})"><i class="fas fa-check"></i>保存</button>
                </div>
            </div>
        `;
        document.getElementById(`editCommentInput-${commentId}`).focus();
    }

    async function saveCommentEdit(commentId) {
        const input = document.getElementById(`editCommentInput-${commentId}`);
        if (!input) return;
        const content = input.value.trim();
        if (!content) {
            AnglrToast.warning('评论内容不能为空');
            return;
        }
        try {
            await apiFetch(`/api/forum/comments/${commentId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            AnglrToast.success('评论已更新');
            loadPost();
        } catch (error) {
            handleError(error, '修改失败');
        }
    }

    async function deletePost() {
        const ok = await AnglrConfirm({ title: '删除帖子', body: '删除后帖子和评论都不可恢复，确认删除？', okText: '删除', danger: true });
        if (!ok) return;
        try {
            await apiFetch(`/api/forum/posts/${postId}`, { method: 'DELETE' });
            try { sessionStorage.setItem('anglr.flash', '帖子已删除'); } catch (e) { /* ignore */ }
            window.location.href = '/forum';
        } catch (error) {
            handleError(error, '删除失败');
        }
    }

    function editPost() {
        if (!currentPost) return;
        const currentTag = currentPost.tag || '野钓';
        const imageUrlsText = Array.isArray(currentPost.image_urls) ? currentPost.image_urls.join('\n') : '';
        const tagOptions = POST_TAGS.map(tag =>
            `<option value="${escapeHTML(tag)}"${tag === currentTag ? ' selected' : ''}>${escapeHTML(tag)}</option>`
        ).join('');

        document.getElementById('postContent').innerHTML = `
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-pen" aria-hidden="true"></i>编辑帖子</h2>
                </div>
                <div class="card-body">
                    <div class="form-grid">
                        <div class="span-2">
                            <label for="editPostTitle" class="form-label">标题</label>
                            <input type="text" class="form-control" id="editPostTitle" maxlength="255" value="${escapeHTML(currentPost.title)}">
                        </div>
                        <div class="span-2">
                            <label for="editPostTag" class="form-label">标签</label>
                            <select class="form-select" id="editPostTag">${tagOptions}</select>
                        </div>
                        <div class="span-2">
                            <label for="editPostContent" class="form-label">内容</label>
                            <textarea class="form-control" id="editPostContent" rows="10">${escapeHTML(currentPost.content)}</textarea>
                        </div>
                        <div class="span-2">
                            <label for="editPostImages" class="form-label">图片地址</label>
                            <textarea class="form-control" id="editPostImages" rows="3" placeholder="一行一个 URL">${escapeHTML(imageUrlsText)}</textarea>
                            <span class="form-hint">「秀出鱼获」最多 3 张，其他标签最多 5 张。</span>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-secondary" type="button" onclick="loadPost()"><i class="fas fa-xmark"></i>取消</button>
                        <button class="btn btn-primary" type="button" onclick="savePostEdit()"><i class="fas fa-check"></i>保存</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('editPostTitle').focus();
    }

    function savePostEdit() {
        const tag = document.getElementById('editPostTag').value.trim();
        updatePost({
            title: document.getElementById('editPostTitle').value.trim(),
            content: document.getElementById('editPostContent').value.trim(),
            tag,
            image_urls: parseImageUrls(document.getElementById('editPostImages').value, tag)
        });
    }

    function parseImageUrls(value, tag = '') {
        const limit = tag === '秀出鱼获' ? 3 : 5;
        return value
            .split(/\n+/)
            .map(item => item.trim())
            .filter(Boolean)
            .slice(0, limit);
    }

    async function updatePost(postData) {
        if (!postData.title || !postData.content) {
            AnglrToast.warning('标题和内容不能为空');
            return;
        }
        try {
            await apiFetch(`/api/forum/posts/${postId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(postData)
            });
            AnglrToast.success('帖子已更新');
            loadPost();
        } catch (error) {
            handleError(error, '更新失败');
        }
    }

    document.addEventListener('DOMContentLoaded', async function() {
        if (localStorage.getItem('token')) {
            try {
                const me = await apiFetch('/api/auth/me');
                currentUserId = me.id;
                currentUserIsAdmin = Boolean(me.is_admin);
            } catch (e) {
                console.error('Failed to fetch current user');
            }
        }
        loadPost();
    });
</script>
{% endblock %}
