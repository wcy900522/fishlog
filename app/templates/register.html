{% extends "base.html" %}

{% block title %}注册 - AnglrLog{% endblock %}

{% block content %}
<div class="auth-layout">
    <aside class="auth-layout__brand" aria-hidden="true">
        <h2>渔迹录</h2>
        <p>把每一次出钓，转化为可沉淀的个人经验。</p>
    </aside>
    <div class="auth-layout__form">
        <div class="auth-card reveal">
            <div class="auth-card__head">
                <i class="fas fa-user-plus"></i>
                <h1>创建账户</h1>
                <p>注册后即可记录钓点、出钓与渔获。</p>
            </div>

            <div id="formAlert" class="alert d-none mb-4" role="alert"></div>
            <form id="registerForm" class="stack stack--tight" novalidate>
                <div>
                    <label for="nickname" class="form-label">昵称</label>
                    <input type="text" class="form-control" id="nickname" name="nickname" placeholder="其他钓友看到的名字" autocomplete="nickname" required>
                </div>
                <div>
                    <label for="phone" class="form-label">手机号</label>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="用于登录" autocomplete="username" inputmode="tel" required>
                </div>
                <div>
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="至少 8 位，包含字母和数字" autocomplete="new-password" required>
                    <div class="pw-meter" aria-hidden="true"><span id="pwMeterBar"></span></div>
                    <small class="form-hint" id="pwHint">至少 8 位，需同时包含字母和数字，不能使用连续数字或常见弱密码。</small>
                </div>
                <div>
                    <label for="confirmPassword" class="form-label">确认密码</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="再输入一次" autocomplete="new-password" required>
                    <small id="confirmHint" class="form-hint"></small>
                </div>
                <button type="submit" class="btn btn-primary mt-2">
                    <i class="fas fa-user-plus"></i>注册账户
                </button>
            </form>

            <p class="text-center text-2 fs-sm mt-4 mb-0">
                已有账户？<a href="/login" class="text-link">直接登录</a>
            </p>
        </div>
    </div>
</div>

<script>
    function getPasswordComplexityError(password) {
        const weakPasswords = new Set([
            '123456',
            '12345678',
            '123456789',
            '11111111',
            '00000000',
            'password',
            'password123',
            'qwerty123'
        ]);
        const lower = password.toLowerCase();
        const sequences = ['0123456789', '9876543210', 'abcdefghijklmnopqrstuvwxyz', 'zyxwvutsrqponmlkjihgfedcba'];

        if (password.length < 8) {
            return '密码长度不能少于8位';
        }
        if (weakPasswords.has(lower)) {
            return '密码过于简单，请换一个更安全的密码';
        }
        if (!/[A-Za-z]/.test(password) || !/\d/.test(password)) {
            return '密码必须同时包含字母和数字';
        }
        if (new Set(password).size === 1 || sequences.some(sequence => sequence.includes(lower))) {
            return '密码不能使用连续或重复字符';
        }
        return '';
    }

    function passwordStrength(password) {
        if (!password) return 0;
        let score = 0;
        if (password.length >= 8) score++;
        if (password.length >= 12) score++;
        if (/[A-Za-z]/.test(password) && /\d/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;
        if (getPasswordComplexityError(password)) score = Math.min(score, 1);
        return score;
    }

    function formatRegisterError(payload) {
        if (payload && typeof payload.message === 'string') {
            return payload.message;
        }
        if (payload && Array.isArray(payload.detail)) {
            const passwordError = payload.detail.find(item => Array.isArray(item.loc) && item.loc.includes('password'));
            if (passwordError && passwordError.msg) {
                return passwordError.msg.replace(/^Value error,\s*/, '');
            }
        }
        if (payload && typeof payload.detail === 'string') {
            if (payload.detail === 'Phone already registered') {
                return '该手机号已被注册';
            }
            return payload.detail;
        }
        return '注册失败，请重试';
    }

    function showFormAlert(message, type = 'danger') {
        const box = document.getElementById('formAlert');
        const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
        box.className = `alert alert-${type} mb-4`;
        box.innerHTML = `<i class="fas ${icon}"></i><span></span>`;
        box.querySelector('span').textContent = message;
    }

    function clearFormAlert() {
        const box = document.getElementById('formAlert');
        box.className = 'alert d-none';
    }

    const confirmInput = document.getElementById('confirmPassword');
    const passwordInput = document.getElementById('password');
    const confirmHint = document.getElementById('confirmHint');
    const meterBar = document.getElementById('pwMeterBar');

    function updateConfirmHint() {
        const confirm = confirmInput.value;
        if (!confirm) {
            confirmHint.textContent = '';
            confirmInput.classList.remove('is-valid', 'is-invalid');
            return;
        }
        if (confirm === passwordInput.value) {
            confirmHint.textContent = '两次密码一致';
            confirmHint.className = 'form-hint text-success';
            confirmInput.classList.add('is-valid');
            confirmInput.classList.remove('is-invalid');
        } else {
            confirmHint.textContent = '两次密码不一致';
            confirmHint.className = 'form-msg';
            confirmInput.classList.add('is-invalid');
            confirmInput.classList.remove('is-valid');
        }
    }

    function updateMeter() {
        const score = passwordStrength(passwordInput.value);
        meterBar.dataset.level = String(score);
    }

    confirmInput.addEventListener('input', updateConfirmHint);
    passwordInput.addEventListener('input', () => { updateConfirmHint(); updateMeter(); });

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        clearFormAlert();

        const nickname = document.getElementById('nickname').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!nickname || !phone) {
            showFormAlert('请填写昵称和手机号');
            return;
        }

        if (password !== confirmPassword) {
            showFormAlert('两次输入的密码不一致');
            return;
        }

        const passwordError = getPasswordComplexityError(password);
        if (passwordError) {
            showFormAlert(passwordError);
            return;
        }

        const btn = this.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>注册中...';

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nickname, phone, password })
            });

            if (response.ok) {
                showFormAlert('注册成功！正在跳转到登录…', 'success');
                setTimeout(() => { window.location.href = '/login'; }, 900);
            } else {
                const payload = await response.json().catch(() => null);
                showFormAlert(formatRegisterError(payload));
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        } catch (error) {
            console.error('Error:', error);
            showFormAlert('注册失败，请重试');
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });
</script>
{% endblock %}
