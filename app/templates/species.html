{% extends "base.html" %}
{% from "_macros.html" import page_head %}

{% block title %}鱼种库 - AnglrLog{% endblock %}

{% block content %}
<div class="container-app">
    {% call page_head('鱼种库', icon='fa-fish', sub='沉淀目标鱼种、常见钓法和常用饵料。', sub_id='pageSub', eyebrow='资料库') %}
        <button class="btn btn-primary" type="button" id="addBtn" onclick="openForm()" hidden><i class="fas fa-plus"></i>新增鱼种</button>
    {% endcall %}

    <div class="toolbar reveal">
        <div class="toolbar__search">
            <i class="fas fa-magnifying-glass"></i>
            <input class="form-control" id="keywordFilter" placeholder="搜索鱼种名称、分类" aria-label="搜索鱼种">
        </div>
        <div class="toolbar__side">
            <input class="form-control" id="categoryFilter" placeholder="分类：路亚 / 淡水 / 海水" aria-label="分类筛选">
            <button class="btn btn-secondary" onclick="loadSpecies()">筛选</button>
            <button class="btn btn-ghost" onclick="resetFilters()">重置</button>
        </div>
    </div>

    <div class="card mb-4" id="adminForm" hidden>
        <div class="card-header">
            <h2 id="formTitle"><i class="fas fa-plus"></i>新增鱼种</h2>
            <button class="btn btn-ghost btn-sm" type="button" onclick="resetForm(true)"><i class="fas fa-xmark"></i>收起</button>
        </div>
        <div class="card-body">
            <div class="form-grid">
                <div>
                    <label class="form-label req" for="name">名称</label>
                    <input class="form-control" id="name" placeholder="如：鲈鱼">
                </div>
                <div>
                    <label class="form-label" for="category">分类</label>
                    <input class="form-control" id="category" placeholder="如：路亚、淡水、海水">
                </div>
                <div class="span-all">
                    <label class="form-label" for="imageUrl">图片 URL</label>
                    <input class="form-control" id="imageUrl" placeholder="https://">
                </div>
                <div>
                    <label class="form-label" for="methods">常见钓法</label>
                    <input class="form-control" id="methods" placeholder="如：路亚、台钓">
                </div>
                <div>
                    <label class="form-label" for="baits">常用饵料</label>
                    <input class="form-control" id="baits" placeholder="如：软虫、亮片">
                </div>
                <div class="span-all">
                    <label class="form-label" for="description">介绍</label>
                    <textarea class="form-control" id="description" rows="3" placeholder="习性、季节、出没水层"></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="resetForm(true)" type="button">取消</button>
                <button class="btn btn-primary" onclick="saveSpecies()" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <div class="row g-3" id="speciesList"></div>
</div>

<script>
let currentUser = null;
let editingSpeciesId = null;

function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function openForm() {
    const card = document.getElementById('adminForm');
    card.hidden = false;
    card.scrollIntoView({behavior: 'smooth', block: 'start'});
    document.getElementById('name').focus();
}

async function loadCurrentUser() {
    const token = localStorage.getItem('token');
    if (!token) return;
    try {
        currentUser = await apiFetch('/api/auth/me');
        if (currentUser.is_admin) document.getElementById('addBtn').hidden = false;
    } catch (error) {
        currentUser = null;
    }
}

async function loadSpecies() {
    const list = document.getElementById('speciesList');
    const params = new URLSearchParams();
    const keyword = document.getElementById('keywordFilter').value.trim();
    const category = document.getElementById('categoryFilter').value.trim();
    if (keyword) params.set('keyword', keyword);
    if (category) params.set('category', category);
    list.innerHTML = AnglrSkeleton('card', 3);
    let rows;
    try {
        rows = await apiFetch(`/api/species${params.toString() ? `?${params}` : ''}`);
    } catch (error) {
        list.innerHTML = `<div class="col-12">${AnglrState({type: 'error', title: '加载失败', text: error.message})}</div>`;
        return;
    }
    document.getElementById('pageSub').textContent = `共 ${rows.length} 个鱼种 · 沉淀目标鱼种、常见钓法和常用饵料。`;
    list.innerHTML = rows.length ? rows.map(item => `
        <div class="col-md-6 col-xl-4">
            <article class="card h-100">
                ${item.image_url ? `<img src="${escapeHTML(item.image_url)}" alt="${escapeHTML(item.name)}" class="media-thumb media-thumb--flush" loading="lazy">` : ''}
                <div class="card__body">
                    <div class="card__eyebrow">
                        <span class="badge badge-info">${escapeHTML(item.category || '未分类')}</span>
                    </div>
                    <h3 class="card__title">${escapeHTML(item.name)}</h3>
                    <p class="card__desc clamp-3">${escapeHTML(item.description || '暂无介绍')}</p>
                    <div class="card__meta">
                        ${item.common_methods ? `<span><i class="fas fa-route"></i>${escapeHTML(item.common_methods)}</span>` : ''}
                        ${item.common_baits ? `<span><i class="fas fa-worm"></i>${escapeHTML(item.common_baits)}</span>` : ''}
                    </div>
                    ${currentUser?.is_admin ? `
                    <div class="card__foot">
                        <button class="btn btn-sm btn-secondary" onclick="editSpeciesById(${item.id})"><i class="fas fa-pen"></i>编辑</button>
                        <button class="btn btn-sm btn-ghost text-danger" onclick="deleteSpecies(${item.id})"><i class="fas fa-trash"></i>删除</button>
                    </div>` : ''}
                </div>
            </article>
        </div>
    `).join('') : `<div class="col-12">${AnglrState({title: '没有匹配的鱼种', text: '换个关键词试试。', icon: 'fa-fish'})}</div>`;
}

async function editSpeciesById(id) {
    try {
        const item = await apiFetch(`/api/species/${id}`);
        editSpecies(item);
    } catch (error) {
        AnglrToast.error(error.message);
    }
}

async function saveSpecies() {
    const name = document.getElementById('name').value.trim();
    if (!name) {
        AnglrToast.warning('请填写鱼种名称');
        document.getElementById('name').focus();
        return;
    }
    const payload = {
        name,
        category: document.getElementById('category').value.trim() || null,
        image_url: document.getElementById('imageUrl').value.trim() || null,
        common_methods: document.getElementById('methods').value.trim() || null,
        common_baits: document.getElementById('baits').value.trim() || null,
        description: document.getElementById('description').value.trim() || null
    };
    const url = editingSpeciesId ? `/api/species/${editingSpeciesId}` : '/api/species';
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    try {
        await apiFetch(url, {
            method: editingSpeciesId ? 'PUT' : 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        AnglrToast.success(editingSpeciesId ? '鱼种已更新' : '鱼种已添加');
        resetForm(true);
        await loadSpecies();
    } catch (error) {
        AnglrToast.error(error.message);
    } finally {
        btn.disabled = false;
    }
}

function editSpecies(item) {
    editingSpeciesId = item.id;
    document.getElementById('formTitle').innerHTML = '<i class="fas fa-pen"></i>编辑鱼种';
    document.getElementById('saveBtn').textContent = '保存修改';
    document.getElementById('name').value = item.name || '';
    document.getElementById('category').value = item.category || '';
    document.getElementById('imageUrl').value = item.image_url || '';
    document.getElementById('methods').value = item.common_methods || '';
    document.getElementById('baits').value = item.common_baits || '';
    document.getElementById('description').value = item.description || '';
    openForm();
}

async function deleteSpecies(id) {
    const ok = await AnglrConfirm({title: '删除鱼种', body: '删除后不可恢复，确定要删除这个鱼种吗？', okText: '删除', danger: true});
    if (!ok) return;
    try {
        await apiFetch(`/api/species/${id}`, {method: 'DELETE'});
        AnglrToast.success('已删除');
        await loadSpecies();
    } catch (error) {
        AnglrToast.error(error.message);
    }
}

function resetForm(collapse) {
    editingSpeciesId = null;
    document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus"></i>新增鱼种';
    document.getElementById('saveBtn').textContent = '保存';
    document.querySelectorAll('#adminForm input, #adminForm textarea').forEach(el => el.value = '');
    if (collapse) document.getElementById('adminForm').hidden = true;
}

function resetFilters() {
    document.getElementById('keywordFilter').value = '';
    document.getElementById('categoryFilter').value = '';
    loadSpecies();
}

document.getElementById('keywordFilter').addEventListener('keydown', e => { if (e.key === 'Enter') loadSpecies(); });

document.addEventListener('DOMContentLoaded', async function() {
    await loadCurrentUser();
    await loadSpecies();
});
</script>
{% endblock %}
