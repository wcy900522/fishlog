{% extends "base.html" %}
{% from "_macros.html" import page_head %}

{% block title %}讨论专区 - AnglrLog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/pages/forum.css?v={{ asset_v }}">
{% endblock %}

{% block content %}
<div class="container-app">
    {% call page_head('讨论专区', icon='fa-comments', sub='分享钓鱼经验，交流技术技巧。', eyebrow='社区') %}
        <a href="/forum/create" class="btn btn-primary" data-auth-only hidden>
            <i class="fas fa-pen"></i>发布新帖
        </a>
        <a href="/login" class="btn btn-secondary" data-guest-only>
            <i class="fas fa-right-to-bracket"></i>登录后发帖
        </a>
    {% endcall %}

    <div class="toolbar reveal">
        <div class="toolbar__search">
            <i class="fas fa-magnifying-glass"></i>
            <input type="text" class="form-control" id="searchInput" placeholder="搜索帖子标题或内容" aria-label="搜索帖子">
        </div>
        <button class="btn btn-secondary" type="button" onclick="searchPosts()">搜索</button>
        <div class="toolbar__chips" id="tagFilter" role="group" aria-label="标签筛选">
            <button type="button" class="chip chip--active" data-tag="" onclick="selectTag('')">全部</button>
            <button type="button" class="chip" data-tag="海钓" onclick="selectTag('海钓')">海钓</button>
            <button type="button" class="chip" data-tag="路亚" onclick="selectTag('路亚')">路亚</button>
            <button type="button" class="chip" data-tag="台钓" onclick="selectTag('台钓')">台钓</button>
            <button type="button" class="chip" data-tag="飞钓" onclick="selectTag('飞钓')">飞钓</button>
            <button type="button" class="chip" data-tag="黑坑" onclick="selectTag('黑坑')">黑坑</button>
            <button type="button" class="chip" data-tag="野钓" onclick="selectTag('野钓')">野钓</button>
            <button type="button" class="chip" data-tag="技术分享" onclick="selectTag('技术分享')">技术分享</button>
            <button type="button" class="chip" data-tag="装备评测" onclick="selectTag('装备评测')">装备评测</button>
            <button type="button" class="chip" data-tag="钓点攻略" onclick="selectTag('钓点攻略')">钓点攻略</button>
            <button type="button" class="chip" data-tag="秀出鱼获" onclick="selectTag('秀出鱼获')">秀出鱼获</button>
        </div>
    </div>

    <div id="postsContainer" class="row-list"></div>
    <div class="text-center mt-4" id="loadMoreWrap" hidden>
        <button class="btn btn-secondary" type="button" id="loadMoreBtn" onclick="loadMore()">加载更多</button>
    </div>
</div>

<script>
    let currentPage = 0;
    let currentTag = '';
    let currentKeyword = '';
    const postsPerPage = 10;

    function formatDate(dateString) {
        const date = new Date(dateString);
        if (Number.isNaN(date.getTime())) return '';
        const now = new Date();
        const sameYear = date.getFullYear() === now.getFullYear();
        return date.toLocaleString('zh-CN', sameYear
            ? { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }
            : { year: 'numeric', month: 'numeric', day: 'numeric' });
    }

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, function(char) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char];
        });
    }

    function truncateContent(content, length = 120) {
        const text = String(content ?? '').replace(/\s+/g, ' ').trim();
        if (text.length > length) {
            return text.substring(0, length) + '…';
        }
        return text;
    }

    function renderPost(post) {
        const images = Array.isArray(post.image_urls) ? post.image_urls.slice(0, 3) : [];
        const initial = String(post.user_nickname || '匿').trim().charAt(0).toUpperCase();
        return `
            <a href="/forum/posts/${post.id}" class="row-item row-item--link post-row">
                <span class="avatar" aria-hidden="true">${escapeHTML(initial)}</span>
                <div class="row-item__main">
                    <div class="post-row__tags">
                        <span class="badge badge-info">${escapeHTML(post.tag || '野钓')}</span>
                        ${post.is_featured ? '<span class="badge badge-amber"><i class="fas fa-star"></i>精华</span>' : ''}
                    </div>
                    <h3 class="row-item__title">${escapeHTML(post.title)}</h3>
                    <p class="post-row__excerpt clamp-2">${escapeHTML(truncateContent(post.content))}</p>
                    ${images.length ? `<div class="post-row__images">${images.map(url => `<img src="${escapeHTML(url)}" alt="" loading="lazy">`).join('')}</div>` : ''}
                    <div class="row-item__stats post-row__meta">
                        <span><strong>${escapeHTML(post.user_nickname || '未知用户')}</strong><span class="post-row__level">Lv${post.user_level || 1} · ${escapeHTML(post.user_title || '初学钓手')}</span></span>
                        <span><i class="fas fa-clock"></i>${formatDate(post.created_at)}</span>
                    </div>
                </div>
                <div class="row-item__side post-row__side">
                    <span><i class="fas fa-eye"></i>${post.view_count || 0}</span>
                    <span><i class="fas fa-comment"></i>${post.comment_count || 0}</span>
                    <span><i class="fas fa-heart"></i>${post.like_count || 0}</span>
                </div>
            </a>
        `;
    }

    async function loadPosts(page = 0, keyword = '', append = false) {
        const container = document.getElementById('postsContainer');
        const moreWrap = document.getElementById('loadMoreWrap');
        const moreBtn = document.getElementById('loadMoreBtn');
        if (!append) container.innerHTML = AnglrSkeleton('row', 4);
        moreBtn.disabled = true;
        try {
            const params = new URLSearchParams({
                skip: page * postsPerPage,
                limit: postsPerPage
            });
            if (currentTag) params.append('tag', currentTag);
            if (keyword) params.append('keyword', keyword);

            const url = keyword
                ? `/api/forum/posts/search?${params.toString()}`
                : `/api/forum/posts?${params.toString()}`;

            const response = await fetch(url);
            if (!response.ok) throw new Error('帖子加载失败');

            const posts = await response.json();

            if (!append && posts.length === 0) {
                container.innerHTML = AnglrState({
                    title: keyword || currentTag ? '没有匹配的帖子' : '还没有帖子',
                    text: keyword || currentTag ? '换个关键词或标签试试。' : '来发第一篇吧。',
                    icon: 'fa-comments'
                });
                moreWrap.hidden = true;
                return;
            }

            const html = posts.map(renderPost).join('');
            if (append) {
                container.insertAdjacentHTML('beforeend', html);
            } else {
                container.innerHTML = html;
            }
            currentPage = page;
            moreWrap.hidden = posts.length < postsPerPage;
        } catch (error) {
            console.error('Error loading posts:', error);
            if (!append) container.innerHTML = AnglrState({ type: 'error', title: '加载失败', text: error.message });
            else AnglrToast.error(error.message);
        } finally {
            moreBtn.disabled = false;
        }
    }

    function loadMore() {
        loadPosts(currentPage + 1, currentKeyword, true);
    }

    function searchPosts() {
        currentKeyword = document.getElementById('searchInput').value.trim();
        loadPosts(0, currentKeyword);
    }

    function selectTag(tag) {
        currentTag = tag;
        document.querySelectorAll('#tagFilter .chip').forEach(button => {
            const isActive = button.dataset.tag === tag;
            button.classList.toggle('chip--active', isActive);
            button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
        loadPosts(0, currentKeyword);
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchPosts();
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        loadPosts(0);
    });
</script>
{% endblock %}
