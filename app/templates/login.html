{% extends "base.html" %}

{% block title %}登录 - AnglrLog{% endblock %}

{% block content %}
<div class="auth-layout">
    <aside class="auth-layout__brand" aria-hidden="true">
        <h2>渔迹录</h2>
        <p>每一次出钓的水温、天光、风向与鱼获，都值得被安静地记下。</p>
    </aside>
    <div class="auth-layout__form">
        <div class="auth-card reveal">
            <div class="auth-card__head">
                <i class="fas fa-fish"></i>
                <h1>欢迎回来</h1>
                <p>登录后继续记录你的出钓数据。</p>
            </div>

            <div id="formAlert" class="alert alert-danger d-none mb-4" role="alert"></div>
            <form id="loginForm" class="stack stack--tight" novalidate>
                <div>
                    <label for="phone" class="form-label">手机号</label>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="请输入手机号" autocomplete="username" inputmode="tel" required>
                </div>
                <div>
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary mt-2">
                    <i class="fas fa-right-to-bracket"></i>登录
                </button>
            </form>

            <div class="soft-divider">或</div>

            <a href="/api/auth/wechat/login" id="wechatLoginLink" class="btn btn-secondary w-100">
                <i class="fab fa-weixin"></i>微信授权登录
            </a>

            <p class="text-center text-2 fs-sm mt-4 mb-0">
                还没有账户？<a href="/register" class="text-link">立即注册</a>
            </p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async function() {
        const params = new URLSearchParams(window.location.search);
        const wechatError = params.get('wechat_error');
        if (wechatError) {
            showFormAlert('微信登录失败：' + wechatError);
            window.history.replaceState({}, document.title, '/login');
        }

        const wechatLoginLink = document.getElementById('wechatLoginLink');
        try {
            const response = await fetch('/api/auth/wechat/status');
            const data = await response.json();
            if (!data.enabled) {
                wechatLoginLink.classList.add('disabled');
                wechatLoginLink.setAttribute('aria-disabled', 'true');
                wechatLoginLink.title = '微信登录未配置';
                wechatLoginLink.innerHTML = '<i class="fab fa-weixin"></i>微信登录未启用';
            }
        } catch (error) {
            wechatLoginLink.classList.add('disabled');
            wechatLoginLink.setAttribute('aria-disabled', 'true');
            wechatLoginLink.title = '微信登录状态获取失败';
        }

        wechatLoginLink.addEventListener('click', function(event) {
            if (wechatLoginLink.classList.contains('disabled')) {
                event.preventDefault();
                AnglrToast.warning('微信登录未配置');
            }
        });
    });

    function showFormAlert(message) {
        const box = document.getElementById('formAlert');
        box.innerHTML = '<i class="fas fa-circle-exclamation"></i><span></span>';
        box.querySelector('span').textContent = message;
        box.classList.remove('d-none');
    }

    function clearFormAlert() {
        document.getElementById('formAlert').classList.add('d-none');
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        clearFormAlert();

        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        if (!phone || !password) {
            showFormAlert('请输入手机号和密码');
            return;
        }
        const btn = this.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>登录中...';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ phone, password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                window.location.replace('/');
            } else {
                const message = await parseApiError(response);
                showFormAlert(message === 'Invalid credentials' ? '手机号或密码错误' : message);
            }
        } catch (error) {
            console.error('Error:', error);
            showFormAlert('登录失败，请重试');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });
</script>
{% endblock %}
